<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世说新语·名士风云</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen">
            <h1>世说新语</h1>
            <p id="loading-message">载入中...</p>
            <div class="loading-track" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="loading-progress"></span>
            </div>
            <p id="loading-percent">0%</p>
        </div>
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <header class="title-block">
                <p class="eyebrow">魏晋风骨 · 名士风流</p>
                <h1>世说新语<em>·</em>名士风云</h1>
            </header>
            <div id="start-menu">
                <button id="btn-start">开始游戏</button>
                <button id="btn-intro">游戏介绍</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
