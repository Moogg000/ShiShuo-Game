<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>世说新语 · 编书人</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <div id="loading-screen" class="is-visible">
            <h1>世说新语</h1>
            <p id="loading-message">载入中...</p>
            <div class="loading-track" role="progressbar" aria-label="游戏加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <span id="loading-progress"></span>
            </div>
            <p id="loading-percent">0%</p>
        </div>
        <canvas id="game-canvas"></canvas>
        
        <div id="ui-layer">
            <header class="title-block">
                <p class="eyebrow">南朝宋 · 元嘉年间</p>
                <h1>世说新语<em>·</em>编书人</h1>
            </header>
            <div id="start-menu">
                <button id="btn-start">受命编书</button>
                <button id="btn-intro">游戏介绍</button>
            </div>
        </div>

        <div id="intro-guard" hidden>
            <div class="guard-card" role="dialog" aria-modal="true" aria-labelledby="guard-title" aria-describedby="guard-text">
                <p class="guard-eyebrow">初来乍到</p>
                <h2 id="guard-title">受命之前，先识笔墨</h2>
                <p id="guard-text">看来这是您第一次踏进临川王府。编书人要做的事不复杂，却有些特别——建议先花三分钟读一读玩法说明：您将游历四地、亲闻九件《世说》轶事，然后以自己的取舍落笔成书。</p>
                <button id="guard-read">先读玩法说明</button>
                <button id="guard-skip" class="ghost">不必了，直接受命编书</button>
                <button id="guard-close" aria-label="关闭提示，返回菜单">✕</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
