<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>游历 · 世说编书人</title>
	<link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="game-page book-page journey-page">
	<div class="game-shell">
		<header class="game-header">
			<a class="brand-mark" href="index.html" aria-label="返回首页"><span>世说</span><small>编书人</small></a>
			<div class="header-title">
				<p id="chapter-sub">游历</p>
				<h1 id="chapter-title">在建康与洛下之间</h1>
			</div>
			<div class="chapter-progress" id="journey-progress">启程</div>
		</header>

		<main class="game-layout journey-layout">
			<section class="study-stage">
				<div class="stage-topline"><span id="stage-place"></span><span id="stage-step"></span></div>
				<div id="flow"></div>
			</section>

			<aside class="book-rail">
				<span class="overline">书稿 · 《世说新书》</span>
				<div class="manuscript" id="manuscript"><p class="ms-empty">行囊空空，尚未落笔。</p></div>
				<div class="pressure-box">
					<span class="overline" id="pressure-label">风声</span>
					<div class="pressure-dots" id="pressure-dots"></div>
					<p class="pressure-note">直笔越多，风声越紧。<br>风声关乎书成之日的命运。</p>
				</div>
				<div class="affinity-mini" id="affinity-mini"></div>
			</aside>
		</main>

		<footer class="game-footer"><span>《世说》编书人 · 游历</span><span>遇事 · 应对 · 后话 · 落笔</span></footer>
	</div>
	<script src="js/book.js"></script>
	<script src="js/journey.js"></script>
</body>
</html>
