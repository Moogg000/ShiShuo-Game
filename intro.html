    <p>世说·风流志 / 研学案卷</p>
    <h1>在一字一句之间，<br>读见魏晋风骨</h1>
    <p class="intro-lead">这不是战斗游戏，而是一场以《世说新语》为底本的古文研学。你的唯一成长指标，是对文本越来越准确的理解。</p>
    <h2>你将在游戏中做什么？</h2>
    <ul>
        <li>选择四条研学线路：艺苑、山林、庙堂、容止。</li>
        <li>先读原文与译文，再通过情境抉择验证理解。</li>
        <li>答对获得风度，答错进入复习模式，并查看原文解析。</li>
        <li>消耗风度向名士请教，解锁更深的词句与文化背景。</li>
    </ul>
    <h2>设计原则</h2>
    <p>不设战力、排行榜或抽卡。饮酒、清谈与任诞行为只放回历史语境中解释，不作为可复制的增益机制。</p>
