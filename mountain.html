<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>隐逸 · 世说风流志</title>
	<link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="css/style.css">
</head>
<body class="game-page route-page route-mountain">
	<div class="game-shell">
		<header class="game-header">
			<a class="brand-mark" href="start.html" aria-label="返回线路总览"><span>世说</span><small>风流志</small></a>
			<div class="header-title">
				<p>研学线路 / 隐逸</p>
				<h1>在山水与任诞之间，辨认自我</h1>
			</div>
			<div class="grace-meter">
				<span>风度</span>
				<strong id="grace-value" aria-live="polite"></strong>
				<i>✦</i>
			</div>
		</header>
		<main class="game-layout" data-route="mountain">
			<aside class="route-rail">
				<div class="rail-heading"><span>本卷三题</span><small>03 LESSONS</small></div>
				<nav class="lesson-nav" aria-label="题目导航"></nav>
				<div class="rail-note"><span class="seal">知</span><p>读原文，<br>辨其意。</p></div>
			</aside>
			<section class="study-stage">
				<div class="stage-topline"><span>隐逸</span><span id="chapter-progress">研读 01 / 03</span></div>
				<div class="lesson-list"></div>
				<section class="completion-panel" hidden>
					<span class="overline">本卷完成</span>
					<h2>你的研读结果</h2>
					<p class="completion-score"></p>
					<a class="home-link" href="index.html">返回首页</a>
				</section>
			</section>
			<aside class="mentor-panel">
				<div class="mentor-header"><span class="overline">名士请教</span><span class="mentor-status">每次请教 - 3 风度</span></div>
				<div class="mentor-card">
					<div class="mentor-portrait"><span>谢</span><i>✦</i></div>
					<h2>谢道韫</h2><p class="mentor-role">文学 · 雅量</p>
					<p class="mentor-copy">从比喻、风神与女性书写的角度，帮你读懂字句。</p>
					<button class="mentor-button" data-mentor="谢道韫">请教她 <span>- 3</span></button>
				</div>
				<div class="mentor-card">
					<div class="mentor-portrait mentor-portrait-court"><span>王</span><i>✦</i></div>
					<h2>王羲之</h2><p class="mentor-role">风仪 · 自然</p>
					<p class="mentor-copy">从自然真率的姿态出发，提醒你回到人物的行动细节。</p>
					<button class="mentor-button" data-mentor="王羲之">请教他 <span>- 3</span></button>
				</div>
				<div class="lesson-note"><span>名士札记</span><p>先读原文，再让选择回答你的理解。</p></div>
			</aside>
		</main>
	</div>
	<script src="js/config.js"></script>
	<script src="js/state.js"></script>
	<script src="js/route.js"></script>
</body>
</html>
